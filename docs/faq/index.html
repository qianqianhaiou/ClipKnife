      {
        "@type": "Question",
        "name": "素刀 ClipKnife 需要联网使用吗？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "素刀的核心功能（素材扫描、AI 索引、智能搜索、视频分镜、语音转写）全部在本地完成，不需要联网。仅在检查更新、拉取通知和可选的外部视觉描述时需要网络连接。"
        }
      },
      {
        "@type": "Question",
        "name": "素刀会上传我的素材文件吗？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "不会。素材文件始终保留在你的电脑中。素刀只创建索引和缩略图用于本地搜索，不会将你的素材上传到任何服务器。"
        }
      },
      {
        "@type": "Question",
        "name": "素刀支持哪些类型的素材？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "目前支持图片（JPG、PNG、WebP 等）、视频（MP4、AVI、MOV 等）和音频（MP3、WAV、FLAC 等）文件。"
        }
      },
      {
        "@type": "Question",
        "name": "视频分镜是什么意思？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "素刀会自动将长视频按场景变化切分成多个片段（分镜），每个分镜有独立的代表帧和可编辑信息。这样你就可以通过搜索找到视频中的某个具体片段，而不是整个视频。"
        }
      },
      {
        "@type": "Question",
        "name": "素刀的本地 AI 需要什么样的硬件？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "运行内存至少需要 16GB。视觉搜索和语音转写功能在 CPU 上也可运行，但 NVIDIA GPU 会大幅提升索引速度，推荐使用具备 CUDA 的 GPU。"
        }
      }
    ]
  }
